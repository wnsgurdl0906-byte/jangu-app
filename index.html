<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>장구 연주 프로토타입</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4e342e">
</head>
<body>
    <div id="app">
        <div id="sound-display">터치해서 연주하세요!</div>
        
        <div id="janggu-container">
            <div id="left-side" class="drum-head">궁편 (쿵)</div>
            <div id="janggu-body"></div>
            <div id="right-side" class="drum-head">채편 (덕)</div>
        </div>
        
        <div id="guide">
            <p>왼쪽: 쿵 | 오른쪽: 덕 | 동시에: 덩</p>
            <p>오른쪽 더블클릭: 기덕 | 오른쪽 꾹: 더러러러</p>
        </div>
    </div>
    <script src="script.js"></script>
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("sw.js")
                    .then(sw => console.log("Service Worker registered"))
                    .catch(err => console.error("SW registration failed", err));
            });
        }
    </script>
</body>
</html>
